# Static site: no build step, everything is served from the repo root.
[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "22"

# ── Headers ────────────────────────────────────────────────────────────────
# Netlify purges its own CDN on every deploy, so the browser rules below only
# need to stop a stale styles.css or screenshot outliving a change.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Fonts come from Fontshare (stylesheet from api., files from cdn.).
    # The sha256 is the one inline script in index.html, which sets the .js
    # class before first paint — if you edit that line, recompute the hash or
    # the script is blocked and every animated element stays hidden.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw='; style-src 'self' https://api.fontshare.com; font-src https://cdn.fontshare.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# The page itself is small and changes often — always revalidate.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Screenshots and brand assets change rarely, but their names are not
# content-hashed — a day is long enough to help and short enough to forgive.
[[headers]]
  for = "/assets/og.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
