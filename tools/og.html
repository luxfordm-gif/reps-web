<!doctype html>
<!--
  Source for assets/og.png — the social share card.
  Rendered at 1200x630 (the 1.91:1 ratio every platform crops to) with:

    node tools/shoot-og.mjs

  Keep it in the repo so the card can be regenerated when the page changes.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=general-sans@400,500,600&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex;
    background: #FAFAFA;
    color: #0A0A0A;
    font-family: 'General Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  /* Mark + headline, centred vertically as a single group. */
  .copy {
    flex: 1 1 58%;
    padding: 64px 0 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  /* Explicit width + flex-start, or the stretched box centres the SVG. */
  .mark { width: 143px; height: auto; align-self: flex-start; margin-bottom: 44px; }

  h1 {
    font-size: 76px;
    font-weight: 600;
    line-height: 1.04;
    letter-spacing: -0.032em;
    max-width: 11ch;
  }
  h1 span { color: #8E8E93; }


  /* The phone bleeds off the bottom-right, same treatment as the hero. */
  .art { position: relative; flex: 1 1 42%; }
  .phone {
    position: absolute;
    top: 76px;
    left: 34px;
    width: 340px;
    padding: 9px;
    background: linear-gradient(160deg, #3A3A3C 0%, #1C1C1E 42%, #000 100%);
    border-radius: 44px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.22);
    transform: rotate(-4deg);
    overflow: hidden;
  }
  .phone img {
    display: block;
    width: 100%;
    aspect-ratio: 1170 / 2532;
    object-fit: cover;
    object-position: top;
    border-radius: 35px;
  }
</style>
</head>
<body>
  <div class="copy">
    <img class="mark" src="../assets/Reps-Logo.svg" alt="" />
    <h1>Never retype your <span>training plan again.</span></h1>
  </div>

  <div class="art">
    <div class="phone"><img src="../assets/shots/reps-calc-b.png" alt="" /></div>
  </div>
</body>
</html>
